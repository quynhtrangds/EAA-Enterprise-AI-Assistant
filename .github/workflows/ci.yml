# ============================================================
# GitHub Actions CI Pipeline
# Enterprise AI Assistant Platform
# Trigger: push/PR on extended_phase (dev) and main
# ============================================================

name: CI – Build, Lint & Test

on:
  push:
    branches: [main, extended_phase]
  pull_request:
    branches: [main, extended_phase]

env:
  NODE_VERSION: '20'

# ────────────────────────────────────────────────────────────
# JOB 1: Test toàn bộ connector packages
# ────────────────────────────────────────────────────────────
jobs:
  test-connectors:
    name: Test Connector Packages
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - mcp-server-crm
          - mcp-server-erpnext
          - mcp-server-gitea
          - mcp-server-postgres
          - mcp-server-rag
          - mcp-server-zammad

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/${{ matrix.package }}

      - name: Build
        run: npm run build
        working-directory: packages/${{ matrix.package }}

      - name: Test
        run: npm test
        working-directory: packages/${{ matrix.package }}

  # ──────────────────────────────────────────────────────────
  # JOB 2: Test mcp-gateway
  # ──────────────────────────────────────────────────────────
  test-mcp-gateway:
    name: Test MCP Gateway
    runs-on: ubuntu-latest
    needs: test-connectors

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/enterprise_ai_test
      JWT_SECRET: ci-test-secret-key-at-least-32-chars
      VAULT_ADDR: http://localhost:8200
      VAULT_TOKEN: root
      CORS_ORIGINS: http://localhost:3000

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: enterprise_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d enterprise_ai_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mcp-gateway/package-lock.json

      - name: Install connector dependencies (needed for build)
        run: |
          for d in packages/mcp-server-*; do
            (cd "$d" && npm ci && npm run build)
          done

      - name: Install mcp-gateway dependencies
        run: npm ci
        working-directory: apps/mcp-gateway

      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: apps/mcp-gateway

      - name: Run tests
        run: npm test
        working-directory: apps/mcp-gateway

  # ──────────────────────────────────────────────────────────
  # JOB 3: Test AI Orchestrator
  # ──────────────────────────────────────────────────────────
  test-ai-orchestrator:
    name: Test AI Orchestrator
    runs-on: ubuntu-latest
    needs: test-connectors

    env:
      NODE_ENV: test
      LLM_PROVIDER: mock
      OPENAI_API_KEY: test-key-ci
      MCP_GATEWAY_URL: http://localhost:8081
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: enterprise_ai_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      JWT_SECRET: ci-test-secret-key-at-least-32-chars

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: enterprise_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d enterprise_ai_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/ai-orchestrator/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/ai-orchestrator

      - name: Apply DB schema & migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d enterprise_ai_test -f database/schema.sql
          psql -h localhost -U postgres -d enterprise_ai_test -f database/seed/seed.sql
          for f in database/migrations/*.sql; do
            echo "Applying $f..."
            psql -h localhost -U postgres -d enterprise_ai_test -f "$f"
          done

      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: apps/ai-orchestrator

      - name: Run tests
        run: npm test
        working-directory: apps/ai-orchestrator

  # ──────────────────────────────────────────────────────────
  # JOB 4: Build & Test Chat UI
  # ──────────────────────────────────────────────────────────
  test-chat-ui:
    name: Build & Test Chat UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/chat-ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/chat-ui

      - name: TypeScript build (tsc + vite)
        run: npm run build
        working-directory: apps/chat-ui

      - name: Run unit tests
        run: npm test
        working-directory: apps/chat-ui

  # ──────────────────────────────────────────────────────────
  # JOB 5: Playwright E2E Testing
  # ──────────────────────────────────────────────────────────
  test-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [test-mcp-gateway, test-ai-orchestrator, test-chat-ui]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/chat-ui/package-lock.json

      - name: Prepare env files
        run: |
          cp apps/ai-orchestrator/.env.example apps/ai-orchestrator/.env 2>/dev/null || touch apps/ai-orchestrator/.env
          cp apps/mcp-gateway/.env.example apps/mcp-gateway/.env 2>/dev/null || touch apps/mcp-gateway/.env

      - name: Build connector packages
        # mcp-gateway container chỉ tự build chính nó (npm run build trong
        # command của service mcp-gateway) — KHÔNG build các package trong
        # /packages (mount qua volume ./packages:/packages). Vì dist/ của
        # các package này bị .gitignore nên trên checkout sạch của CI chưa
        # từng tồn tại. Thiếu bước này, mcp-gateway sẽ báo lỗi "Cannot find
        # module .../dist/index.js" ngay khi Playwright gọi bất kỳ tool nào.
        run: |
          for d in packages/mcp-server-*; do
            (cd "$d" && npm ci && npm run build)
          done

      - name: Build apps on host runner for instant Docker startup
        run: |
          (cd apps/mcp-gateway && npm ci && npm run build)
          (cd apps/ai-orchestrator && npm ci && npm run build)

      - name: Install chat-ui dependencies
        run: |
          sudo chown -R $USER:$USER apps/chat-ui 2>/dev/null || true
          npm ci
        working-directory: apps/chat-ui

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/chat-ui

      - name: Start Full Stack with Docker Compose
        env:
          LLM_PROVIDER: mock
        run: |
          LLM_PROVIDER=mock docker compose up -d
          echo "Waiting for PostgreSQL..."
          until [ "$(docker inspect -f '{{.State.Health.Status}}' enterprise_ai_postgres)" == "healthy" ]; do
            sleep 2
          done

          echo "Waiting for MCP Gateway (8085)..."
          for i in {1..40}; do
            if curl -s http://localhost:8085/health | grep -q "ok"; then
              echo "MCP Gateway is ready!"
              break
            fi
            echo "Waiting for mcp-gateway ($i/40)..."
            sleep 3
          done

          echo "Waiting for AI Orchestrator (8082)..."
          for i in {1..40}; do
            if curl -s http://localhost:8082/health | grep -q "ok"; then
              echo "AI Orchestrator is ready!"
              break
            fi
            echo "Waiting for ai-orchestrator ($i/40)..."
            sleep 3
          done

          echo "Waiting for Chat UI (3000)..."
          for i in {1..40}; do
            if curl -s http://localhost:3000 >/dev/null; then
              echo "Chat UI is ready!"
              break
            fi
            echo "Waiting for chat-ui ($i/40)..."
            sleep 3
          done

      - name: Run Playwright E2E tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 55432
          POSTGRES_DB: enterprise_ai_demo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: npm run test:e2e
        working-directory: apps/chat-ui


  # ──────────────────────────────────────────────────────────
  # JOB 6: Docker Compose validation (lint only, no build)
  # ──────────────────────────────────────────────────────────
  validate-docker-compose:
    name: Validate Docker Compose files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare env files
        run: |
          cp apps/ai-orchestrator/.env.example apps/ai-orchestrator/.env 2>/dev/null || touch apps/ai-orchestrator/.env
          cp apps/mcp-gateway/.env.example apps/mcp-gateway/.env 2>/dev/null || touch apps/mcp-gateway/.env

      - name: Validate docker-compose.yml syntax
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate docker-compose.prod.yml syntax
        # OPENAI_API_KEY required field – provide dummy value for validation only
        env:
          OPENAI_API_KEY: dummy-key-for-validation
        run: docker compose -f docker-compose.prod.yml config --quiet


  # ──────────────────────────────────────────────────────────
  # JOB 7: Summary Gate (required status check)
  # ──────────────────────────────────────────────────────────
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs:
      - test-connectors
      - test-mcp-gateway
      - test-ai-orchestrator
      - test-chat-ui
      - test-e2e
      - validate-docker-compose
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more CI jobs failed."
            exit 1
          fi
          echo "✅ All CI jobs passed."

