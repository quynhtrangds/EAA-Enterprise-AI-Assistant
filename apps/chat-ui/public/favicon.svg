<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle with subtle dark border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#centerGlow)"/>

  <!-- Enterprise AI Emblem -->
  <!-- Top Central Sparkle/Diamond -->
  <path d="M32 10 L38 23 L32 30 L26 23 Z" fill="url(#goldGrad)" filter="url(#softGlow)"/>
  <circle cx="32" cy="23" r="3.5" fill="#0b0f19"/>
  <circle cx="32" cy="23" r="1.5" fill="#fef08a"/>

  <!-- Left & Right Wing Diamonds (Representing Multi-tenant / Microservices Integrations) -->
  <path d="M15 28 L23 35 L19 43 L11 36 Z" fill="url(#cyanGrad)" fill-opacity="0.9"/>
  <path d="M49 28 L53 36 L45 43 L41 35 Z" fill="url(#cyanGrad)" fill-opacity="0.9"/>

  <!-- Lower Anchor Diamond -->
  <path d="M32 40 L40 48 L32 56 L24 48 Z" fill="url(#goldGrad)" filter="url(#softGlow)"/>
  <circle cx="32" cy="48" r="3" fill="#0b0f19"/>
  <circle cx="32" cy="48" r="1.5" fill="#f59e0b"/>

  <!-- Interconnecting Cyber Neural Links -->
  <line x1="32" y1="30" x2="32" y2="40" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="23" x2="19" y2="35" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="38" y1="23" x2="45" y2="35" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="19" y1="43" x2="27" y2="46" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="45" y1="43" x2="37" y2="46" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Core Data Spark / Energy Pulse -->
  <circle cx="32" cy="35" r="2.5" fill="#ffffff" filter="url(#softGlow)"/>
</svg>
