name: enterprise_ai
services:
  postgres:
    image: postgres:15
    container_name: enterprise_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai_demo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./database/prod_init.sql:/docker-entrypoint-initdb.d/01_prod_init.sql:ro
      - ./database/migrations/003_auth_sessions.sql:/docker-entrypoint-initdb.d/03_auth_sessions.sql:ro
      - ./database/migrations/004_chat_history.sql:/docker-entrypoint-initdb.d/04_chat_history.sql:ro
      - ./database/migrations/005_multi_tenant_and_sso.sql:/docker-entrypoint-initdb.d/05_multi_tenant_and_sso.sql:ro
      - ./database/migrations/006_integrations.sql:/docker-entrypoint-initdb.d/06_integrations.sql:ro
      - ./database/migrations/007_fix_username_tenant_scope.sql:/docker-entrypoint-initdb.d/07_fix_username_tenant_scope.sql:ro
      - ./database/migrations/008_chat_sessions_tenant_and_star.sql:/docker-entrypoint-initdb.d/08_chat_sessions_tenant_and_star.sql:ro
      - ./database/migrations/009_add_users_role_column.sql:/docker-entrypoint-initdb.d/09_add_users_role_column.sql:ro
      - ./database/migrations/010_tenant_isolation_indexes.sql:/docker-entrypoint-initdb.d/10_tenant_isolation_indexes.sql:ro
      - ./database/migrations/011_account_lockout.sql:/docker-entrypoint-initdb.d/11_account_lockout.sql:ro
      - ./database/migrations/012_integration_test_status.sql:/docker-entrypoint-initdb.d/12_integration_test_status.sql:ro
      # Thư mục backup trên máy host — scripts/backup-postgres.ps1 ghi vào đây
      - ./database/backups:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-enterprise_ai_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-gateway:
    image: node:20-alpine
    container_name: enterprise_ai_mcp_gateway
    working_dir: /app
    command: sh -c "[ -d node_modules ] || npm install --include=dev; npm run build && npm run start"
    restart: unless-stopped
    env_file:
      - ./apps/mcp-gateway/.env
    environment:
      NODE_ENV: development
      PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai_demo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # QUAN TRỌNG: .env.example đặt VAULT_ADDR=http://127.0.0.1:8200 (đúng
      # cho chạy local ngoài Docker), nhưng bên TRONG container,
      # localhost/127.0.0.1 trỏ về chính container mcp-gateway, không phải
      # container vault. Phải dùng tên service Docker "vault". Khai báo ở
      # đây (environment:) để override giá trị sai từ env_file (.env), vì
      # Docker Compose ưu tiên environment: cao hơn env_file: khi trùng key.
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      INTEGRATION_TEST_ALLOWED_PRIVATE_HOSTS: "*"
    ports:
      - "${MCP_GATEWAY_PORT:-8081}:8081"
    volumes:
      - ./apps/mcp-gateway:/app
      - ./packages:/packages
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy

  ai-orchestrator:
    image: node:20-alpine
    container_name: enterprise_ai_orchestrator
    working_dir: /app
    command: sh -c "[ -d node_modules ] || npm install --include=dev; npm run build && npm run start"
    restart: unless-stopped
    env_file:
      - ./apps/ai-orchestrator/.env
    environment:
      NODE_ENV: development
      PORT: 8082
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      MCP_GATEWAY_URL: http://mcp-gateway:8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai_demo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${AI_ORCHESTRATOR_PORT:-8082}:8082"
    volumes:
      - ./apps/ai-orchestrator:/app
      - ./packages:/packages
    depends_on:
      - mcp-gateway

  chat-ui:
    image: node:20-alpine
    container_name: enterprise_ai_chat_ui
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    environment:
      CHAT_UI_PORT: 3000
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:8082
      MCP_GATEWAY_URL: http://mcp-gateway:8081
    ports:
      - "${CHAT_UI_PORT:-3000}:3000"
    volumes:
      - ./apps/chat-ui:/app
      - /app/node_modules
    depends_on:
      - ai-orchestrator

  # Vault SERVER MODE (không còn dev mode): secret lưu file trên volume,
  # sống sót qua restart/rebuild container. scripts/vault-entrypoint.sh tự
  # init lần đầu, tự unseal sau mỗi lần restart, và tự tạo token ID 'root'
  # để mcp-gateway (VAULT_TOKEN=root) chạy tiếp không cần sửa .env.
  # File key nằm ở /vault/data/init-keys.json trên volume — HÃY SAO LƯU.
  vault:
    image: hashicorp/vault:latest
    container_name: enterprise_ai_vault
    entrypoint: ["sh", "/vault/scripts/entrypoint.sh"]
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
      - ./scripts/vault-entrypoint.sh:/vault/scripts/entrypoint.sh:ro
    restart: unless-stopped
    cap_add:
      - IPC_LOCK

  gitea:
    image: gitea/gitea:1.21-rootless
    container_name: enterprise_ai_gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=gitea_db
      - GITEA__database__USER=postgres
      - GITEA__database__PASSWD=postgres
      - GITEA__server__ROOT_URL=http://localhost:3001/
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__HTTP_PORT=3000
    ports:
      - "3001:3000"
      - "2222:2222"
    volumes:
      - gitea_data:/var/lib/gitea
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: enterprise_ai_postgres_data
  vault_data:
    name: enterprise_ai_vault_data
  gitea_data:
    name: enterprise_ai_gitea_data